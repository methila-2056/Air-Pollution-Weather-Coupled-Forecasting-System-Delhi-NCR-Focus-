services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerocast
      POSTGRES_PASSWORD: aerocast_secret_2024
      POSTGRES_DB: aerocast_ncr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerocast -d aerocast_ncr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aerocast:aerocast_secret_2024@db:5432/aerocast_ncr
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml:/app/ml
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
